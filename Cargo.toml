[package]
name = "snapper-TUI-rust"
version = "0.1.9"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
crossterm = "0.29.0"
ratatui = "0.28.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tachyonfx = "0.7.0"

[profile.release]
codegen-units = 1 # Allows compiler to perform better optimization.
lto = true # Enables Link-time Optimization.
opt-level = 3 # Prioritizes execution speed.
strip = true # Ensures debug symbols are removed.