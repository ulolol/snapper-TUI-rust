[workspace]
resolver = "2"
members = [
    "crates/snapper-core",
    "crates/snapper-tui",
    "crates/snapperman",
]
default-members = ["crates/snapper-tui", "crates/snapperman"]

[workspace.package]
version = "0.7.3"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
dirs = "6"
gpui-kit = { version = "0.10.0", features = ["syntect"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
snapper-core = { path = "crates/snapper-core" }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[profile.dev]
debug = "limited"

[profile.dev.package]
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
ropey = { opt-level = 3 }
syntect = { opt-level = 3 }

[profile.release]
lto = "thin"
opt-level = 3
strip = "symbols"
